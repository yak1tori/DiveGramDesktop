name: DiveGram Releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TDESKTOP_API_ID: ${{ vars.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ vars.TDESKTOP_API_HASH }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Build our env image (their centos_env Dockerfile -> one env)
        run: |
          docker build -t divegram_env -f Telegram/build/docker/centos_env/Dockerfile .
      - name: Configure (source root, API vars, Ninja Release)
        run: |
          docker run --rm -v "$PWD:/usr/src/tdesktop" -w /usr/src/tdesktop \
            divegram_env \
            cmake -S /usr/src/tdesktop -B /usr/src/tdesktop/out-cc -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DTDESKTOP_API_ID="$TDESKTOP_API_ID" \
              -DTDESKTOP_API_HASH="$TDESKTOP_API_HASH"
      - name: Build Release
        run: |
          docker run --rm -v "$PWD:/usr/src/tdesktop" -w /usr/src/tdesktop \
            divegram_env \
            cmake --build /usr/src/tdesktop/out-cc --config Release --target Telegram -j"$(nproc)"
      - name: Package (deb/rpm/pkg.tar.zst/tar.xz)
        run: |
          docker run --rm -v "$PWD:/usr/src/tdesktop" -w /usr/src/tdesktop \
            divegram_env \
            bash -lc 'set -e; cd /usr/src/tdesktop && git checkout dist.sh 2>/dev/null || true; BIN=out-cc/Release/DiveGram; [ -f "$BIN" ] || BIN=out-cc/Release/Telegram; VERSION=${GITHUB_REF_NAME#v}; bash dist.sh "$BIN" "$VERSION" dist'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { path: dist/* }
      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*, generate_release_notes: true }
